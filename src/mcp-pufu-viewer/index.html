<!doctype html>
<html lang="__PUFU_LANGUAGE__" data-image-origin="__PUFU_IMAGE_ORIGIN__">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <title>__PUFU_VIEWER__</title>
    <!-- MCP Apps SDK license: __PUFU_IMAGE_ORIGIN__/licenses/mcp-apps.txt -->
    <style>
      /* VIEWER_STYLE */
    </style>
  </head>
  <body>
    <main id="viewer" aria-label="__PUFU_VIEWER__">
      <h1 id="title">__PUFU_TITLE__</h1>
      <p id="metadata"></p>
      <p id="status" role="status" aria-live="polite">__PUFU_STATUS__</p>
      <p id="updated" role="status" hidden>__PUFU_UPDATED__</p>
      <div id="toolbar" class="toolbar" aria-label="__PUFU_TOOLBAR__">
        <button id="zoom-out" type="button" aria-label="__PUFU_ZOOM_OUT__">−</button>
        <button id="fit" type="button">__PUFU_FIT__</button>
        <button id="zoom-in" type="button" aria-label="__PUFU_ZOOM_IN__">＋</button>
        <button id="fullscreen" type="button" hidden>__PUFU_FULLSCREEN__</button>
        <button id="download" type="button">__PUFU_DOWNLOAD__</button>
        <button id="retry" type="button">__PUFU_RETRY__</button>
      </div>
      <a id="external" target="_blank" rel="noopener noreferrer" hidden>__PUFU_EXTERNAL__</a>
      <div id="viewport" tabindex="0" aria-label="__PUFU_VIEWPORT__"></div>
      <details>
        <summary id="summary">__PUFU_SUMMARY__</summary>
        <p id="target"></p>
      </details>
    </main>
    <script>
      /* VIEWER_SCRIPT */
    </script>
  </body>
</html>
