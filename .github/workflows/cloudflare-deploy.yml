name: Cloudflare Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

# Do not interrupt a running migration or overlap production deployments.
concurrency:
  group: cloudflare-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  WRANGLER_SEND_METRICS: 'false'
  WRANGLER_SEND_ERROR_REPORTS: 'false'
  WRANGLER_LOG_SANITIZE: 'true'
  CLOUDFLARE_LOAD_DEV_VARS_FROM_DOT_ENV: 'false'

jobs:
  validate:
    uses: ./.github/workflows/validate.yml

  check:
    name: Check
    needs: validate
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require all validation jobs to pass
        env:
          VALIDATION_RESULT: ${{ needs.validate.result }}
        run: test "$VALIDATION_RESULT" = success

  deploy:
    name: Deploy production
    needs: check
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.repository == 'dyson-yamashita/pufu-lens-stock'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: production
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
          cache: false
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      # Build without deployment credentials or Google OAuth secrets.
      - name: Build production
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: pnpm run build:production
      - name: Migrate D1 and deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo '::error::production EnvironmentにCLOUDFLARE_API_TOKENとCLOUDFLARE_ACCOUNT_IDを登録してください。'
            exit 1
          fi
          pnpm exec wrangler d1 migrations apply stock-db --remote --env production --config wrangler.jsonc
          pnpm exec wrangler deploy --env production
