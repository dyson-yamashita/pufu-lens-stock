name: Validate application

on:
  workflow_call:
    inputs:
      application:
        description: Run application validation in addition to formatting
        type: boolean
        default: true

permissions:
  contents: read

env:
  WRANGLER_SEND_METRICS: 'false'
  WRANGLER_SEND_ERROR_REPORTS: 'false'
  WRANGLER_LOG_SANITIZE: 'true'
  CLOUDFLARE_LOAD_DEV_VARS_FROM_DOT_ENV: 'false'

jobs:
  formal:
    if: ${{ inputs.application }}
    name: Lean proofs, axiom audit and mutation checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install elan 4.1.2
        run: |
          curl --fail --location --retry 3 https://github.com/leanprover/elan/releases/download/v4.1.2/elan-x86_64-unknown-linux-gnu.tar.gz -o "$RUNNER_TEMP/elan.tar.gz"
          echo "f81c2e48c1588d4612cd2c8851947898a45ac8d72748a07dff3a5694f1cf589b  $RUNNER_TEMP/elan.tar.gz" | sha256sum --check
          mkdir "$RUNNER_TEMP/elan-installer"
          tar -xzf "$RUNNER_TEMP/elan.tar.gz" -C "$RUNNER_TEMP/elan-installer"
          "$RUNNER_TEMP/elan-installer/elan-init" -y --default-toolchain none --no-modify-path
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Verify every registered Lean target
        run: python3 formal/verify.py
      - name: Test registry and axiom audit rejection paths
        run: python3 -m unittest discover -s formal -p 'test_*.py' -v

  quality:
    name: Formatting and application quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
          cache: false
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Type check
        if: ${{ inputs.application }}
        run: pnpm run typecheck
      - name: Lint
        if: ${{ inputs.application }}
        run: pnpm run lint
      - name: Check formatting
        run: pnpm run format:check
      - name: Build application
        if: ${{ inputs.application }}
        run: pnpm run build
      - name: Audit dependencies
        if: ${{ inputs.application }}
        run: pnpm run audit

  tests:
    if: ${{ inputs.application }}
    name: Tests (${{ matrix.shard }}/4)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
          cache: false
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Run test shard
        run: pnpm run test --shard=${{ matrix.shard }}/4

  e2e:
    if: ${{ inputs.application }}
    name: Browser E2E (${{ matrix.target }}, ${{ matrix.shard }}/2, recorded actions, no AI)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target: [desktop, phone]
        shard: [1, 2]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
          cache: false
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Check scenario ledger
        run: pnpm run e2e:check
      - name: Identify Ubuntu runner image
        id: ubuntu-image
        run: printf 'version=%s\n' "$ImageVersion" >> "$GITHUB_OUTPUT"
      - name: Cache Chromium system packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/chromium-apt/*.deb
          key: chromium-apt-v1-ubuntu-24.04-${{ runner.arch }}-${{ steps.ubuntu-image.outputs.version }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Chromium
        env:
          E2E_TELEMETRY_DISABLED: '1'
        run: |
          archives="$RUNNER_TEMP/chromium-apt"
          mkdir -p "$archives"
          sudo tee /etc/apt/apt.conf.d/99-pufu-e2e-cache >/dev/null <<EOF
          Dir::Cache::archives "$archives";
          APT::Update::Post-Invoke { "bash '$GITHUB_WORKSPACE/scripts/e2e/verify-apt-archives.sh' '$archives'"; };
          EOF
          pnpm --filter @pufu-lens/e2e exec e2e-web install chromium --with-deps
      - name: Replay browser tests without AI
        run: pnpm run e2e:ci --target ${{ matrix.target }} --shard ${{ matrix.shard }}/2
      - name: Keep failure reports and traces
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-failure-${{ matrix.target }}-${{ matrix.shard }}
          path: packages/e2e/.e2e/runs/
          include-hidden-files: true
          retention-days: 7
