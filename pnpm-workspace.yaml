autoInstallPeers: true
packages:
  - packages/*

# 固定・検証済みのバージョンに限り、公開後24時間の待機を除外する。
minimumReleaseAgeExclude:
  - '@goto-lab/pufu-editor@0.9.19'
  - '@napi-rs/canvas@1.0.13'
  - '@napi-rs/canvas-android-arm64@1.0.13'
  - '@napi-rs/canvas-darwin-arm64@1.0.13'
  - '@napi-rs/canvas-darwin-x64@1.0.13'
  - '@napi-rs/canvas-linux-arm-gnueabihf@1.0.13'
  - '@napi-rs/canvas-linux-arm64-gnu@1.0.13'
  - '@napi-rs/canvas-linux-arm64-musl@1.0.13'
  - '@napi-rs/canvas-linux-riscv64-gnu@1.0.13'
  - '@napi-rs/canvas-linux-x64-gnu@1.0.13'
  - '@napi-rs/canvas-linux-x64-musl@1.0.13'
  - '@napi-rs/canvas-win32-arm64-msvc@1.0.13'
  - '@napi-rs/canvas-win32-x64-msvc@1.0.13'

overrides:
  # e2e 0.21.3 pins zod 4.6.1; use the patched compatible release.
  e2e>zod: 4.6.7
  undici: ^7.29.1
  sharp: ^0.35.5
  short-uuid>uuid: ^11.1.1

allowBuilds:
  core-js-pure: false
  esbuild: true
  sharp: true
  workerd: true

patchedDependencies:
  '@cloudflare/workers-oauth-provider@1.2.3': patches/@cloudflare__workers-oauth-provider@1.2.3.patch
  miniflare@4.20260730.0: patches/miniflare@4.20260730.0.patch
